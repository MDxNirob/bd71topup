<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Info Checker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;600&family=Poppins:wght@300;400;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d12;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top, #1f1f2e, #0d0d12);
        }

        .container {
            background: #16161e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #2a2a35;
        }

        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 2.5rem;
            color: #ff9900;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        input[type="number"] {
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #09090c;
            color: #fff;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #ff9900;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #ff9900, #ff5500);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 102, 0, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Result Box Styling */
        #resultBox {
            display: none;
            background: #1e1e28;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            border-left: 4px solid #ff9900;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2a2a35;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #888;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .stat-value {
            color: #fff;
            font-weight: 400;
        }

        .loading {
            display: none;
            color: #ff9900;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .error {
            color: #ff3333;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Account Inspector</h1>
        
        <div class="input-group">
            <input type="number" id="uidInput" placeholder="Enter Player UID" required>
            <button onclick="fetchPlayerInfo()">Search UID</button>
        </div>

        <div id="loadingText" class="loading">Fetching data...</div>
        <div id="errorMessage" class="error">Player not found or invalid UID.</div>

        <div id="resultBox">
            <div class="stat-row">
                <span class="stat-label">Name:</span>
                <span class="stat-value" id="resName">--</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Level:</span>
                <span class="stat-value" id="resLevel">--</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Likes:</span>
                <span class="stat-value" id="resLikes">--</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">BR Rank:</span>
                <span class="stat-value" id="resRank">--</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Guild:</span>
                <span class="stat-value" id="resGuild">--</span>
            </div>
        </div>
    </div>

    <script>
        async function fetchPlayerInfo() {
            const uid = document.getElementById('uidInput').value;
            const resultBox = document.getElementById('resultBox');
            const loadingText = document.getElementById('loadingText');
            const errorText = document.getElementById('errorMessage');

            // Reset UI
            resultBox.style.display = 'none';
            errorText.style.display = 'none';

            if (!uid) {
                alert("Please enter a valid UID.");
                return;
            }

            loadingText.style.display = 'block';

            try {
                // ==========================================
                // NOTE: Replace the URL below with your actual API endpoint.
                // Example: const response = await fetch(`https://your-api-server.com/api/info?uid=${uid}`);
                // ==========================================
                
                // Simulating an API call with a 1.5-second delay
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // Mock Data (Delete this block when you have a real API)
                const mockApiResponse = {
                    success: true,
                    data: {
                        name: "B2K 亗 YT",
                        level: 72,
                        likes: 15432,
                        brRank: "Heroic",
                        guild: "Team Liquid"
                    }
                };

                // Check if the mock (or real) response was successful
                if (mockApiResponse.success) {
                    document.getElementById('resName').innerText = mockApiResponse.data.name;
                    document.getElementById('resLevel').innerText = mockApiResponse.data.level;
                    document.getElementById('resLikes').innerText = mockApiResponse.data.likes;
                    document.getElementById('resRank').innerText = mockApiResponse.data.brRank;
                    document.getElementById('resGuild').innerText = mockApiResponse.data.guild;

                    loadingText.style.display = 'none';
                    resultBox.style.display = 'block';
                } else {
                    throw new Error("UID not found");
                }

            } catch (error) {
                loadingText.style.display = 'none';
                errorText.style.display = 'block';
            }
        }
    </script>
</body>
</html>
