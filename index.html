<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Item Store</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f0f13;
            color: #fff;
        }

        /* --- Header & Navigation --- */
        header {
            background: #181820;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff4500;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ff4500;
            text-transform: uppercase;
        }

        .cart-btn {
            background: #ff4500;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .cart-btn:hover { background: #e03e00; }

        /* --- Custom Image Banner --- */
        .banner {
            /* REPLACE THE URL BELOW WITH YOUR OWN BANNER IMAGE LINK */
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?ixlib=rb-1.2.1&auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .banner h1 {
            font-size: 3rem;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .banner p {
            font-size: 1.2rem;
            color: #ccc;
        }

        /* --- Product Grid --- */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            margin-bottom: 30px;
            font-size: 2rem;
            border-left: 5px solid #ff4500;
            padding-left: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #1c1c24;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border: 1px solid #2a2a35;
            transition: transform 0.3s;
        }

        .product-card:hover { transform: translateY(-5px); border-color: #ff4500; }

        .product-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .product-price {
            color: #00ffcc;
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .add-btn {
            width: 100%;
            padding: 10px;
            background: #2a2a35;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .add-btn:hover { background: #ff4500; }

        /* --- Cart Modal --- */
        #cartModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .cart-content {
            background: #1c1c24;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #ff4500;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .close-cart { cursor: pointer; color: #ff4500; }

        #cartItems { margin-bottom: 20px; max-height: 200px; overflow-y: auto; }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2a35;
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: 800;
            text-align: right;
            margin-bottom: 20px;
            color: #00ffcc;
        }

        .checkout-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #0f0f13;
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;
        }

        .whatsapp-btn {
            width: 100%;
            padding: 12px;
            background: #25D366; /* WhatsApp Green */
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }
        
        .whatsapp-btn:hover { background: #20b858; }

    </style>
</head>
<body>

    <header>
        <div class="logo">Loot<span style="color:#fff;">Store</span></div>
        <button class="cart-btn" onclick="toggleCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
    </header>

    <div class="banner">
        <h1>Level Up Your Game</h1>
        <p>Instant delivery. Secure payments. Best prices.</p>
    </div>

    <div class="container">
        <h2 class="section-title">Top Ups & Memberships</h2>
        
        <div class="grid">
            <!-- Product 1 -->
            <div class="product-card">
                <div class="product-icon">💎</div>
                <div class="product-title">100-Diamond Bundle</div>
                <div class="product-price">৳ 80</div>
                <button class="add-btn" onclick="addToCart('100-Diamond Bundle', 80)">Add to Cart</button>
            </div>

            <!-- Product 2 -->
            <div class="product-card">
                <div class="product-icon">👑</div>
                <div class="product-title">Membership Lite</div>
                <div class="product-price">৳ 150</div>
                <button class="add-btn" onclick="addToCart('Membership Lite', 150)">Add to Cart</button>
            </div>

            <!-- Product 3 -->
            <div class="product-card">
                <div class="product-icon">💎</div>
                <div class="product-title">520 Diamonds</div>
                <div class="product-price">৳ 400</div>
                <button class="add-btn" onclick="addToCart('520 Diamonds', 400)">Add to Cart</button>
            </div>

            <!-- Product 4 -->
            <div class="product-card">
                <div class="product-icon">🏆</div>
                <div class="product-title">Weekly Membership</div>
                <div class="product-price">৳ 180</div>
                <button class="add-btn" onclick="addToCart('Weekly Membership', 180)">Add to Cart</button>
            </div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <span>Your Cart</span>
                <span class="close-cart" onclick="toggleCart()">✖</span>
            </div>
            
            <div id="cartItems">
                <!-- Items will be injected here via JS -->
            </div>
            
            <div class="cart-total">Total: ৳ <span id="cartTotal">0</span></div>

            <input type="text" id="playerUid" class="checkout-input" placeholder="Enter your Game UID" required>
            
            <button class="whatsapp-btn" onclick="checkoutWhatsApp()">Checkout via WhatsApp</button>
        </div>
    </div>

    <script>
        let cart = [];
        let total = 0;

        // Change this to your actual WhatsApp Number (Include Country Code, e.g., 880 for BD)
        const myWhatsAppNumber = "8801XXXXXXXXX"; 

        function addToCart(itemName, itemPrice) {
            cart.push({ name: itemName, price: itemPrice });
            total += itemPrice;
            updateCartUI();
            alert(`${itemName} added to cart!`);
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            document.getElementById('cartTotal').innerText = total;
            
            const cartItemsContainer = document.getElementById('cartItems');
            cartItemsContainer.innerHTML = ''; // Clear current
            
            if(cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color:#888; text-align:center;">Cart is empty</p>';
                return;
            }

            cart.forEach((item, index) => {
                cartItemsContainer.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <span>৳ ${item.price}</span>
                    </div>
                `;
            });
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
            updateCartUI();
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            const uid = document.getElementById('playerUid').value;
            if(!uid) {
                alert("Please enter your Player UID before checking out.");
                return;
            }

            // Build the WhatsApp message
            let message = `*New Order Request* 🛒%0A%0A`;
            message += `*Player UID:* ${uid}%0A`;
            message += `---------------------------%0A`;
            
            cart.forEach(item => {
                message += `▪ ${item.name} - ৳ ${item.price}%0A`;
            });
            
            message += `---------------------------%0A`;
            message += `*Total Amount:* ৳ ${total}%0A%0A`;
            message += `Please confirm my order and send payment details.`;

            // Open WhatsApp link
            const waLink = `https://wa.me/${myWhatsAppNumber}?text=${message}`;
            window.open(waLink, '_blank');
        }
    </script>
</body>
</html>
